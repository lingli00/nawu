name: Build APK

# 手动触发（Actions 页面 Run workflow），或推 v* 标签触发并自动发 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          # lockfile 在 Windows 生成，缺 Linux 原生可选依赖（npm/cli#4828），CI 补装
          npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 || true

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
        # 说明：Capacitor 7.6.9 的 capacitor-android 模块按 Java 21 编译
        # （"invalid source release: 21"），JDK 21 可正常编译本项目 17 源码。

      # 注：ubuntu runner 自带 Android SDK（ANDROID_HOME 已配置、许可证已接受），
      # 不要用 android-actions/setup-android@v3 —— 它尝试安装已废弃的 'tools' 包会失败。

      # v1.0.33 安全修复：签名口令从 GitHub Secrets 注入，不再依赖仓库里的明文口令。
      # 需要在仓库配置 4 个 secret：NAWU_STORE_FILE（密钥库文件名，如 nawu-release.p12）、
      # NAWU_STORE_PASSWORD、NAWU_KEY_ALIAS、NAWU_KEY_PASSWORD。
      # 密钥库文件本身建议用 base64 存 secret，构建时落盘（见下一步）。
      - name: Materialize signing keystore (optional)
        if: ${{ secrets.NAWU_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.NAWU_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/${{ secrets.NAWU_STORE_FILE }}

      - name: Build release APK
        env:
          NAWU_STORE_FILE: ${{ secrets.NAWU_STORE_FILE }}
          NAWU_STORE_PASSWORD: ${{ secrets.NAWU_STORE_PASSWORD }}
          NAWU_KEY_ALIAS: ${{ secrets.NAWU_KEY_ALIAS }}
          NAWU_KEY_PASSWORD: ${{ secrets.NAWU_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        id: apk
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          OUT="nawu-v${VER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: nawu-apk-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
